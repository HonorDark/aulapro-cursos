name: AulaFlow CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aulapro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aulapro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aulapro_test
      JWT_SECRET: ci-only-aulaflow-secret-with-more-than-32-characters
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Crear esquema y fixtures de prueba
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql
      - run: npm run migrate
      - run: npm run verify:readiness
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
