name: aulaflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aulaflow}
      POSTGRES_USER: ${POSTGRES_USER:-aulaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en docker.env}
      AULAFLOW_LOAD_DEMO_DATA: ${AULAFLOW_LOAD_DEMO_DATA:-false}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database:/opt/aulaflow/database:ro
      - ./backend/database/docker-init.sh:/docker-entrypoint-initdb.d/001-aulaflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en docker.env; usa el host db}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en docker.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["sh","-c","node dist/scripts/migrate.js && node dist/server.js"]
    depends_on:
      db:
        condition: service_healthy
    expose: ["4000"]
    networks: [internal]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_ENABLE_PRIVILEGED_DEMO: ${VITE_ENABLE_PRIVILEGED_DEMO:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_WEB_PORT:-8080}:80"
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
